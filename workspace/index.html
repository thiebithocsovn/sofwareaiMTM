function addExecutiveOrder(f){const v=Object.fromEntries(new FormData(f).entries());const title=(v.title||'').trim(),description=(v.description||'').trim();if(!title||!description||!v.due){toast('Vui lòng nhập đủ tên, mô tả và hạn công việc','error');return}if(v.due<iso(new Date())){toast('Ngày hoàn thành phải từ hôm nay trở đi','error');return}let route=v.department==='auto'?suggestDepartments(title+' '+description):{ids:[v.department],review:false};const code='CV-'+String(data.orders.length+1).padStart(3,'0');const o={id:id(),code,title,description,priority:v.priority,due:v.due,projectId:v.projectId,createdAt:`${clockNow()} ${dateDisplay(iso(new Date()))}`,needsReview:route.review,approved:false,history:[],assignments:route.ids.map(deptId=>({id:id(),deptId,status:'Đã giao',note:'',taskId:null}))};
logOrder(o,route.review?'Trợ lý đề xuất Phòng Hành chính; chờ Giám đốc xác nhận vì yêu cầu chưa rõ lĩnh vực.':`Trợ lý đã phân công (theo từ khóa) tới ${route.ids.length} phòng.`);
if(!route.review)for(const a of o.assignments){const d=getDept(a.deptId),taskId=id();a.taskId=taskId;data.tasks.unshift({id:taskId,title:`[${o.code}] ${o.title} — ${d.name}`,projectId:o.projectId||'',assignee:d.head,priority:o.priority,due:o.due,status:'Cần làm',description:o.description,orderId:o.id})}
data.orders.unshift(o);addActivity(`${o.code}: Trợ lý ${route.review?'đề nghị duyệt phân tuyến':'đã giao Trưởng phòng'}`,'briefcase');save();render();toast(route.review?'Đã tạo phiếu, cần xác nhận phòng ban':'Đã triển khai vào bảng công việc (bản mẫu)')}
function reviewExecutiveOrder(orderId){const o=data.orders.find(o=>o.id===orderId);if(!o||!o.needsReview)return;const a=o.assignments[0];const chosen=document.querySelector(`[data-review-dept="${orderId}"]`)?.value;if(chosen&&DEPARTMENTS.some(d=>d.id===chosen))a.deptId=chosen;const d=getDept(a.deptId);if(!confirm(`Xác nhận giao lệnh “${o.title}” cho ${d.name}?`))return;o.needsReview=false;a.taskId=id();data.tasks.unshift({id:a.taskId,title:`[${o.code}] ${o.title} — ${d.name}`,projectId:o.projectId||'',assignee:d.head,priority:o.priority,due:o.due,status:'Cần làm',description:o.description,orderId:o.id});logOrder(o,`Giám đốc xác nhận phân tuyến ${d.name}`);addActivity(`Đã duyệt phân tuyến ${o.code}`,'shield');save();render();toast('Đã giao nhiệm vụ (bản mẫu)')}
function headUpdate(orderId,assignmentId,status){const o=data.orders.find(o=>o.id===orderId);const a=o?.assignments.find(a=>a.id===assignmentId);if(!o||!a||o.approved||o.needsReview)return;
const allowed={'Đã giao':['Đã nhận'],'Đã nhận':['Đang thực hiện','Báo vướng mắc'],'Đang thực hiện':['Đã hoàn thành','Báo vướng mắc'],'Báo vướng mắc':['Đang thực hiện']};if(!(allowed[a.status]||[]).includes(status))return;
let note='';if(status==='Báo vướng mắc'||status==='Đã hoàn thành'){note=prompt(status==='Báo vướng mắc'?'Trưởng phòng báo vướng mắc / đề xuất hỗ trợ:':'Trưởng phòng ghi kết quả đã bàn giao (demo):',a.note||'');if(note===null)return;note=note.trim();if(!note){toast('Cần có nội dung báo cáo trước khi gửi','error');return}if(note.length>1000){toast('Báo cáo tối đa 1.000 ký tự','error');return}}a.status=status;if(note)a.note=note;syncDelegatedTask(a);logOrder(o,`${getDept(a.deptId).head}: ${status}${note?' — '+note:''}`);addActivity(`${o.code}: ${getDept(a.deptId).head} ${status.toLowerCase()}`,'tasks');save();render();toast('Đã cập nhật báo cáo (chỉ trong trình duyệt)')}
function approveExecutiveOrder(orderId){const o=data.orders.find(o=>o.id===orderId);if(!o||o.approved||o.needsReview||!o.assignments.length||!o.assignments.every(a=>a.status==='Đã hoàn thành'))return;if(!confirm(`Giám đốc nghiệm thu tất cả kết quả của ${o.code}?`))return;o.approved=true;logOrder(o,'Giám đốc đã nghiệm thu và đóng lệnh.');addActivity(`Đã nghiệm thu ${o.code}`,'shield');save();render();toast('Đã nghiệm thu lệnh điều hành')}
function reportExecutiveOrder(orderId){const o=data.orders.find(o=>o.id===orderId);if(!o)return;const lines=[`BÁO CÁO ĐIỀU HÀNH ${o.code}`,`Nhiệm vụ: ${o.title}`,`Yêu cầu: ${o.description}`,`Hạn: ${dateDisplay(o.due)} | Ưu tiên: ${o.priority}`,`Trạng thái: ${getOrderState(o)}`,'',...o.assignments.flatMap(a=>{const d=getDept(a.deptId);return [`${d.name} — ${d.head}`,`Trạng thái: ${a.status}`,`Báo cáo: ${a.note||'Chưa có phản hồi.'}`,'']}),'LỊCH SỬ CẬP NHẬT',...(o.history||[])];const content=lines.join('\n');const blob=new Blob([content],{type:'text/plain;charset=utf-8'});const href=URL.createObjectURL(blob);const link=document.createElement('a');link.href=href;link.download=`Bao_cao_${o.code}.txt`;link.click();URL.revokeObjectURL(href);toast('Đã xuất báo cáo TXT')}

function calendar(){const now=new Date(),display=new Date(now.getFullYear(),now.getMonth()+monthOffset,1),year=display.getFullYear(),month=display.getMonth(),dayStart=new Date(year,month,1).getDay(),mondayOffset=(dayStart+6)%7,lastDay=new Date(year,month+1,0).getDate(),prevLast=new Date(year,month,0).getDate(),cells=[];for(let i=0;i<42;i++){let d;if(i<mondayOffset)d=new Date(year,month-1,prevLast-mondayOffset+i+1);else if(i>=mondayOffset+lastDay)d=new Date(year,month+1,i-mondayOffset-lastDay+1);else d=new Date(year,month,i-mondayOffset+1);cells.push(d)}const allEvents=[...data.meetings.map(m=>({...m,type:'meeting'})),...data.tasks.filter(t=>t.due).map(t=>({title:t.title,date:t.due,time:'',type:'task'}))];const selected=allEvents.filter(e=>e.date===selectedDay);return `${heading('LỊCH & SỰ KIỆN','Lịch làm việc','Theo dõi lịch họp, thời hạn đầu việc và các mốc dự án.',`<button class="btn primary" data-act="modal" data-modal="meeting">${ic('plus',15)} Thêm lịch họp</button>`)}<div class="calendar-layout"><section class="panel calendar"><div class="calendar-head"><h3>Tháng ${String(month+1).padStart(2,'0')}/${year}</h3><div style="display:flex;gap:7px"><button class="btn small icon-only" data-act="month-prev" aria-label="Tháng trước">${ic('left',16)}</button><button class="btn small" data-act="month-today">Hôm nay</button><button class="btn small icon-only" data-act="month-next" aria-label="Tháng sau">${ic('right',16)}</button></div></div><div class="calendar-grid">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<div class="calendar-dow">${x}</div>`).join('')}${cells.map(d=>{const day=iso(d),has=allEvents.filter(e=>e.date===day);return `<button class="calendar-day ${d.getMonth()!==month?'other':''} ${day===iso(now)?'today':''} ${day===selectedDay?'selected':''}" data-act="day-select" data-value="${day}"><strong>${d.getDate()}</strong>${has.length?`<div class="event-dots">${has.slice(0,4).map(e=>`<i class="${e.type==='meeting'?'alt':''}"></i>`).join('')}</div>`:''}</butto function clients(){return `${heading('QUAN HỆ KHÁCH HÀNG','Khách hàng & đối tác','Quản lý cơ hội hợp tác và nhu cầu giải pháp công nghệ.',`<button class="btn primary" data-act="modal" data-modal="client">${ic('plus',15)} Thêm khách hàng</button>`)}<div class="panel list-panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Đối tác</th><th>Dịch vụ quan tâm</th><th>Liên hệ</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${data.clients.map(c=>`<tr><td><b>${esc(c.name)}</b><small>${esc(c.company)}</small></td><td>${esc(c.service)}</td><td>${esc(c.email||'Chưa cập nhật')}</td><td>${statusPill(c.status)}</td><td><button class="btn small" data-act="modal" data-modal="client" data-id="${c.id}">${ic('edit',12)} Chỉnh sửa</button></td></tr>`).join('')||`<tr><td colspan="5">${emptyMarkup('Chưa có khách hàng')}</td></tr>`}</tbody></table></div></div>`}
function members(){return `${heading('CƠ CẤU TỔ CHỨC','Nhân sự & phòng ban','Danh bạ đội ngũ làm việc. Tài khoản đăng nhập chưa được triển khai.',`<button class="btn primary" data-act="modal" data-modal="member">${ic('plus',15)} Thêm nhân sự</button>`)}<div class="panel list-panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Họ tên / Nhóm</th><th>Vai trò</th><th>Email</th><th>Quyền truy cập</th><th>Thao tác</th></tr></thead><tbody>${data.members.map((m,i)=>`<tr><td><div class="member-cell"><span class="avatar">${esc(m.name.slice(0,2).toUpperCase())}</span><b>${esc(m.name)}</b></div></td><td>${esc(m.role)}</td><td>${esc(m.email||'Chưa cập nhật')}</td><td><span class="pill gray">Chưa cấp tài khoản</span></td><td><button class="btn small" data-act="modal" data-modal="member" data-id="${m.id}">${ic('edit',12)} Chỉnh sửa</button></td></tr>`).join('')}</tbody></table></div></div><p class="help-note">Ở bản chính thức, cần cơ chế xác thực, vai trò (Owner, Admin, Manager, Staff), phân quyền từng dự án và nhật ký kiểm toán.</p>`}
function settings(){return `${heading('CÁ NHÂN HÓA','Cài đặt không gian','Tùy chỉnh tên hiển thị, sao lưu hoặc khôi phục dữ liệu bản mẫu.')}<div class="settings-layout"><section class="panel settings-panel"><h3>Thông tin không gian làm việc</h3><p>Đây chỉ là tên hiển thị trên trình duyệt, chưa phải hồ sơ pháp lý doanh nghiệp.</p><form id="settings-form"><div class="field"><label for="company-name">Tên công ty / không gian</label><input id="company-name" name="company" value="${esc(data.company)}" required maxlength="100" /></div><button type="submit" class="btn primary">${ic('check',14)} Lưu thiết lập</button></form></section><section class="panel settings-panel"><h3>Dữ liệu & sao lưu</h3><p>Dữ liệu lưu bằng localStorage của trình duyệt này. Nên xuất bản sao trước khi xóa lịch sử duyệt web.</p><div class="settings-row"><button class="btn" data-act="export">${ic('download',15)} Tải bản sao JSON</button><button class="btn" data-act="import">${ic('upload',15)} Nhập bản sao</button><input id="import-input" type="file" accept="application/json,.json" class="hidden" /></div><div class="nav-sep" style="background:#edf0f6;margin:21px 0"></div><button class="btn danger" data-act="reset">${ic('trash',15)} Đặt lại dữ liệu mẫu</button></section><section class="panel settings-panel"><h3>Cấu hình cần có khi triển khai thật</h3><p>Ứng dụng sản xuất nên phát triển thành nền tảng nhiều người dùng và nhiều tổ chức.</p><div class="activity-entry"><div class="activity-icon">${ic('shield',17)}</div><div><b>Đăng nhập & phân quyền</b><p>Xác thực đa tài khoản, tenant doanh nghiệp, phân quyền theo chức danh.</p></div></div><div class="activity-entry"><div class="activity-icon">${ic('file',17)}</div><div><b>Lưu trữ tập trung</b><p>Cơ sở dữ liệu, tệp đính kèm, phiên bản tài liệu và sao lưu.</p></div></div><div class="activity-entry"><div class="activity-icon">${ic('bot',17)}</div><div><b>AI Agent thật</b><p>Xử lý phía máy chủ, hàng đợi tác vụ, log chi phí và phê duyệt.</p></div></div></section><section class="panel settings-panel"><h3>Thông tin bản mẫu</h3><p>Giao diện độc lập một tệp HTML/CSS/JavaScript, không phụ thuộc dịch vụ bên ngoài.</p><div class="notice">${ic('info',14)} Bản mẫu <strong>không nên dùng để lưu dữ liệu cá nhân, hồ sơ học sinh, hợp đồng mật hoặc bí mật kinh doanh</strong>. Chưa có đăng nhập, phân quyền, mã hóa phía máy chủ hay sao lưu an toàn.</div><div style="margin-top:19px"><span class="pill purple">TechSpace 1.1 · Prototype</span></div></section></div>`}
function safeUrl(v){try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch(e){return '#'}}
function optionList(values,current){return values.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('')}
function fld(label,name,value='',type='text',opts={}){const attrs=`name="${name}" id="field-${name}" ${opts.required?'required':''} ${opts.max?`max="${opts.max}"`:''}`;return `<div class="field"><label for="field-${name}">${label}</label>${type==='textarea'?`<textarea ${attrs} rows="3">${esc(value)}</textarea>`:type==='select'?`<select ${attrs}>${optionList(opts.options||[],value)}</select>`:`<input ${attrs} type="${type}" value="${esc(value)}" ${type==='number'?'min="0" max="100"':''} />`}</div>`}
const definition={project:['projects','Dự án'],task:['tasks','Công việc'],note:['notes','Ghi chú'],client:['clients','Khách hàng'],meeting:['meetings','Cuộc họp'],member:['members','Nhân sự']};
function modalHtml(){if(!modal)return '';const [collection,label]=definition[modal];const obj=data[collection].find(x=>x.id===editingId)||{};let fields='';if(modal==='project')fields=fld('Tên dự án *','name',obj.name,'text',{required:true})+fld('Mô tả','description',obj.description,'textarea')+`<div class="form-grid">${fld('Lĩnh vực','area',obj.area||'Phần mềm','select',{options:['Phần mềm','AI Agent','Giáo dục','Kinh doanh','Khác']})}${fld('Trạng thái','status',obj.status||'Mới','select',{options:['Mới','Đang thực hiện','Tạm dừng','Hoàn thành']})}${fld('Tiến độ 0–100 (%)','progress',obj.progress??0,'number')}${fld('Ngày dự kiến','due',obj.due||'','date')}</div>`+fld('Địa chỉ web dự án (nếu có)','url',obj.url||'','url');
if(modal==='task')fields=fld('Tên công việc *','title',obj.title,'text',{required:true})+`<div class="form-grid">${fld('Dự án','projectId',obj.projectId||data.projects[0]?.id||'','select',{options:data.projects.map(p=>p.id).length?data.projects.map(p=>p.id):['']}).replace(/<option([^>]*)>([^<]*)<\/option>/g,(_,at,val)=>`<option${at}>${esc(projectBy(val)?.name||'Chưa có dự án')}</option>`)}${fld('Trạng thái','status',obj.status||'Cần làm','select',{options:['Cần làm','Đang làm','Đã xong']})}${fld('Ưu tiên','priority',obj.priority||'Trung bình','select',{options:['Ưu tiên cao','Trung bình','Thấp']})}${fld('Hạn hoàn thành','due',obj.due||'','date')}</div>`+fld('Người phụ trách','assignee',obj.assignee||'')+fld('Ghi chú','description',obj.description||'','textarea');
if(modal==='note')fields=fld('Tiêu đề *','title',obj.title,'text',{required:true})+fld('Phân loại','category',obj.category||'Nội bộ','select',{options:['Nội bộ','Chiến lược','Sản phẩm','Kỹ thuật','Khác']})+fld('Nội dung','content',obj.content,'textarea');
if(modal==='client')fields=fld('Tên đối tác *','name',obj.name,'text',{required:true})+fld('Tên tổ chức','company',obj.company)+fld('Email','email',obj.email,'email')+fld('Dịch vụ quan tâm','service',obj.service||'Phần mềm')+fld('Trạng thái','status',obj.status||'Tiềm năng','select',{options:['Tiềm năng','Đang trao đổi','Đã ký']});
if(modal==='member')fields=fld('Họ tên / tên nhóm *','name',obj.name,'text',{required:true})+fld('Vai trò','role',obj.role||'Nhân viên')+fld('Email','email',obj.email,'email');
if(modal==='meeting')fields=fld('Nội dung cuộc họp *','title',obj.title,'text',{required:true})+`<div class="form-grid">${fld('Ngày họp *','date',obj.date||selectedDay,'date',{required:true})}${fld('Giờ','time',obj.time||'09:00','time')}</div>`+fld('Địa điểm / hình thức','place',obj.place||'Trực tuyến');
return `<div class="modal-shade" data-act="modal-shade"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${editingId?'Chỉnh sửa':'Tạo mới'} ${label.toLowerCase()}</h2><button class="modal-close" data-act="modal-close" aria-label="Đóng">${ic('close',19)}</button></div><form id="entity-form" class="modal-content" data-modal="${modal}">${fields}<div class="modal-actions">${editingId?`<button type="button" class="btn danger" data-act="delete" data-type="${modal}" data-id="${editingId}" style="margin-right:auto">${ic('trash',14)} Xóa</button>`:''}<button type="button" class="btn" data-act="modal-close">Hủy</button><button type="submit" class="btn primary">${ic('check',15)} ${editingId?'Lưu thay đổi':'Tạo mới'}</button></div></form></div></div>`}
function render(){const currentFocus=document.activeElement?.id;$('#app').innerHTML=layout();$('#modal-root').innerHTML=modalHtml();document.title=`${names[view]} | TechSpace`;if(modal){$('#entity-form input:not([type=hidden])')?.focus()} if(currentFocus==='global-search')$('#global-search')?.focus()}
function openModal(type,editId=null){modal=type;editingId=editId;render()}
function closeModal(){modal=null;editingId=null;render()}
function submitForm(f){const collection=definition[modal]?.[0];if(!collection)return;const record=Object.fromEntries(new FormData(f).entries());let existing=editingId?data[collection].find(x=>x.id===editingId):null;if(modal==='project'){record.progress=Math.max(0,Math.min(100,Number(record.progress)||0));record.color=existing?.color||['#6375ed','#14a991','#d99459','#ca74bd'][data.projects.length%4];if(record.url&&!['https:','http:'].includes((()=>{try{return new URL(record.url).protocol}catch{return ''}})())){toast('Địa chỉ web phải bắt đầu bằng http:// hoặc https://','error');return}}
if(modal==='note')record.updated=iso(new Date());if(modal==='task'&&!record.projectId){toast('Hãy tạo một dự án trước','error');return}
if(existing)Object.assign(existing,record);else data[collection].unshift({id:id(),...record});addActivity(`${existing?'Cập nhật':'Tạo mới'} ${definition[modal][1].toLowerCase()}: ${record.title||record.name||'Không có tên'}`,existing?'edit':'plus');save();modal=null;editingId=null;render();toast('Đã lưu trên trình duyệt')}
function changeTaskStatus(taskId,status){const t=data.tasks.find(x=>x.id===taskId);if(!t||!['Cần làm','Đang làm','Đã xong'].includes(status))return;if(t.orderId){const o=data.orders.find(o=>o.id===t.orderId),a=o?.assignments.find(a=>a.taskId===taskId);if(a){if(o.approved){toast('Lệnh đã nghiệm thu, không thể cập nhật','error');return}if(o.needsReview){toast('Chưa xác nhận phòng ban','error');return}if(status==='Đã xong'&&!a.note){const note=prompt('Trưởng phòng cần ghi kết quả bàn giao để hoàn thành:', '');if(note===null||!note.trim()){toast('Chưa có báo cáo kết quả nên chưa hoàn thành','error');return}a.note=note.trim().slice(0,1000)}a.status=status==='Đã xong'?'Đã hoàn thành':status==='Đang làm'?'Đang thực hiện':'Đã giao';logOrder(o,`${getDept(a.deptId).head}: cập nhật từ Kanban thành ${a.status}`)}}t.status=status;addActivity(`Chuyển công việc “${t.title}” sang “${status}”`,'tasks');save();render();toast('Đã cập nhật trạng thái')}
function deleteEntity(type,entityId){const [col,label]=definition[type]||[];if(!col)return;if(!window.confirm(`Xóa ${label.toLowerCase()} này khỏi dữ liệu bản mẫu?`))return;const item=data[col].find(x=>x.id===entityId);data[col]=data[col].filter(x=>x.id!==entityId);if(type==='project'){for(const t of data.tasks.filter(t=>t.projectId===entityId))t.projectId=''}addActivity(`Đã xóa ${label.toLowerCase()}: ${item?.name||item?.title||''}`,'trash');save();modal=null;editingId=null;render();toast('Đã xóa')}
function toggleAgent(agentId,enabled){const a=data.agents.find(x=>x.id===agentId);if(!a)return;a.enabled=enabled;data.logs.push({time:clockNow(),text:`${a.name}: ${enabled?'bật':'tắt'} chế độ mô phỏng.`,level:'ok'});addActivity(`${enabled?'Bật':'Tắt'} ${a.name} (mô phỏng)`,'bot');save();render();toast(`${a.name}: ${enabled?'đã bật':'đã tắt'} (mô phỏng)`)}
function runAgent(agentId){const a=data.agents.find(x=>x.id===agentId);if(!a||!a.enabled)return;data.logs.push({time:clockNow(),text:`${a.name}: đã nhận yêu cầu chạy thử.`,level:'ok'});data.logs.push({time:clockNow(),text:`${a.name}: hoàn thành chuỗi bước minh họa; không có API AI được gọi.`,level:'warn'});data.logs=data.logs.slice(-40);save();render();toast(`Chạy mô phỏng ${a.name} thành công`)}
function exportJson(){const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download=`techspace-sao-luu-${iso(new Date())}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),500);toast('Đã tạo tệp sao lưu JSON')}
function resetData(){if(!window.confirm('Xóa dữ liệu đang có trong trình duyệt và khôi phục bộ mẫu? Hãy sao lưu trước khi tiếp tục.'))return;data=INITIAL();save();view='overview';render();toast('Đã khôi phục dữ liệu mẫu')}
const search=(term)=>{term=term.toLowerCase().trim();if(!term)return[];return [...data.projects.filter(x=>(x.name+' '+x.description).toLowerCase().includes(term)).map(x=>({label:x.name,sub:'Dự án',view:'projects',id:x.id,type:'project'})),...data.tasks.filter(x=>(x.title+' '+(x.assignee||'')).toLowerCase().includes(term)).map(x=>({label:x.title,sub:'Công việc',view:'tasks',id:x.id,type:'task'})),...data.notes.filter(x=>(x.title+' '+x.content).toLowerCase().includes(term)).map(x=>({label:x.title,sub:'Ghi chú',view:'notes',id:x.id,type:'note'})),...data.clients.filter(x=>(x.name+' '+x.company).toLowerCase().includes(term)).map(x=>({label:x.name,sub:'Khách hàng',view:'clients',id:x.id,type:'client'}))].slice(0,8)};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el){if(!e.target.closest('.search-box'))$('#search-pop')?.classList.add('hidden');return}const act=el.dataset.act;switch(act){case 'nav':onNav(el.dataset.view);break;case 'sidebar-toggle':sideOpen=!sideOpen;render();break;case 'sidebar-close':sideOpen=false;render();break;case 'modal':openModal(el.dataset.modal,el.dataset.id||null);break;case 'modal-close':closeModal();break;case 'modal-shade':if(e.target===el)closeModal();break;case 'project-filter':projectFilter=el.dataset.value;render();break;case 'task-filter':taskFilter=el.dataset.value;render();break;case 'agent-run':runAgent(el.dataset.id);break;case 'head-update':headUpdate(el.dataset.order,el.dataset.assignment,el.dataset.status);break;case 'review-order':reviewExecutiveOrder(el.dataset.id);break;case 'approve-order':approveExecutiveOrder(el.dataset.id);break;case 'report-order':reportExecutiveOrder(el.dataset.id);break;case 'logs-clear':data.logs=[{time:clockNow(),text:'Đã xóa nhật ký mô phỏng.',level:'warn'}];save();render();break;case 'export':exportJson();break;case 'import':$('#import-input')?.click();break;case 'reset':resetData();break;case 'month-prev':monthOffset--;render();break;case 'month-next':monthOffset++;render();break;case 'month-today':monthOffset=0;selectedDay=iso(new Date());render();break;case 'day-select':selectedDay=el.dataset.value;render();break;case 'delete':deleteEntity(el.dataset.type,el.dataset.id);break;case 'search-result':{const tarView=el.dataset.view,tarId=el.dataset.id,tarType=el.dataset.type;onNav(tarView);openModal(tarType,tarId);break;}default:break}});
document.addEventListener('change',async e=>{const el=e.target;if(el.dataset.act==='task-status')changeTaskStatus(el.dataset.id,el.value);if(el.dataset.act==='agent-toggle')toggleAgent(el.dataset.id,el.checked);if(el.id==='import-input'&&el.files?.[0]){try{if(el.files[0].size>2_000_000)throw Error('Tệp vượt quá giới hạn 2MB');let v=JSON.parse(await el.files[0].text());for(const k of ['projects','tasks','agents','notes','clients','members','meetings','activity','logs'])if(!Array.isArray(v[k]))throw Error('Tệp không đúng định dạng dữ liệu');if(!Array.isArray(v.orders))v.orders=[];if(!confirm('Thay thế dữ liệu trên thiết bị bằng tệp sao lưu đã chọn?'))return;data=v;save();render();toast('Đã khôi phục dữ liệu JSON')}catch(err){toast('Không thể nhập: '+err.message,'error')}}});
document.addEventListener('submit',e=>{if(e.target.id==='executive-form'){e.preventDefault();addExecutiveOrder(e.target)}if(e.target.id==='entity-form'){e.preventDefault();submitForm(e.target)}if(e.target.id==='settings-form'){e.preventDefault();data.company=(new FormData(e.target).get('company')||'').trim();save();render();toast('Đã lưu tên không gian làm việc')}});
document.addEventListener('input',e=>{if(e.target.id!=='global-search')return;const pop=$('#search-pop'),items=search(e.target.value);pop.classList.toggle('hidden',!e.target.value.trim());pop.innerHTML=items.length?items.map(it=>`<button class="search-result" data-act="search-result" data-view="${it.view}" data-id="${it.id}" data-type="${it.type}">${ic('search',15)}<span>${esc(it.label)}<small>${esc(it.sub)}</small></span></button>`).join(''):`<div class="empty" style="min-height:70px"><small>Không tìm thấy kết quả</small></div>`});
let dragId=null;document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-task]');if(!c)return;dragId=c.dataset.task;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});document.addEventListener('dragover',e=>{const col=e.target.closest('[data-drop]');if(col){e.preventDefault();col.classList.add('drag-over')}});document.addEventListener('dragleave',e=>{const col=e.target.closest('[data-drop]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('drag-over')});document.addEventListener('drop',e=>{const col=e.target.closest('[data-drop]');if(!col)return;e.preventDefault();document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));if(dragId)changeTaskStatus(dragId,col.dataset.drop);dragId=null});document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal)closeModal();else $('#search-pop')?.classList.add('hidden')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#global-search')?.focus()}});
render();
</script>
</body>
</html>
